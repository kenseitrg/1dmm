[project]
name = "mm1d"
version = "0.1.0"
description = "1.5D reflectivity synthetic modelling for multiple analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm1d"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.ipynb"] # reference notebooks stay untouched

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "RUF", # ruff-specific
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
